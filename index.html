<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IMPULSO | Marketplace de Servicios</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<meta name="description" content="IMPULSO es un marketplace de servicios donde conectas directamente con clientes sin intermediación en pagos.">
<meta property="og:title" content="IMPULSO - Marketplace de Servicios">
<meta property="og:description" content="Conecta. Ofrece. Impulsa.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://arturotlate-cmd.github.io/impulso-beta/">
</head>

<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="logo">IMPULSO</div>
    <div class="nav-links">
      <a href="products.html">Explorar</a>
      <a href="publicar.html">Publicar</a>
      <a href="perfil.html">Perfil</a>
      <button id="loginBtn" class="btn-secondary">Iniciar sesión</button>
      <button id="logoutBtn" class="btn-secondary" style="display:none;">Cerrar sesión</button>
    </div>
  </div>
</nav>

<section class="hero">
  <div class="mesh-bg"></div>
  <div class="hero-glow"></div>

  <div class="hero-content">
    <h1>Conecta. Ofrece. Impulsa.</h1>
    <p class="subtitle">
      Marketplace de servicios sin intermediación en pagos.
    </p>
    <div class="hero-buttons">
      <a href="products.html" class="btn-primary">Explorar servicios</a>
      <a href="publicar.html" class="btn-secondary">Publicar servicio</a>
    </div>
  </div>
</section>

<footer class="footer">
  © 2026 IMPULSO · Impulsando oportunidades
</footer>

<div class="cursor"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const navbar = document.querySelector(".navbar");
window.addEventListener("scroll", () => {
  navbar.classList.toggle("scrolled", window.scrollY > 50);
});

/* Cursor premium solo desktop */
if (window.innerWidth > 1024) {
  const cursor = document.querySelector(".cursor");
  document.addEventListener("mousemove", e=>{
    cursor.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
  });
} else {
  const cursor = document.querySelector(".cursor");
  if(cursor) cursor.style.display = "none";
}

});
</script>

<script type="module">
import { loginWithGoogle, logoutUser, observeAuth } from "./auth.js";

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

observeAuth(user => {
  if (user) {
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  } else {
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
});

loginBtn.addEventListener("click", loginWithGoogle);
logoutBtn.addEventListener("click", logoutUser);
</script>

</body>
</html>
