<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Perfil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Mi Perfil</h2>
  <div id="userInfo"></div>

  <h3>Mis Productos</h3>
  <div id="myProducts"></div>

  <h3>Mis Conversaciones</h3>
  <div id="myChats"></div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { observeAuth } from "./auth.js";
import {
  collection,
  query,
  where,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const userInfo = document.getElementById("userInfo");
const myProducts = document.getElementById("myProducts");
const myChats = document.getElementById("myChats");

observeAuth(async user => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  userInfo.innerHTML = `<p><strong>${user.displayName}</strong><br>${user.email}</p>`;

  // PRODUCTOS DEL USUARIO
  const productQuery = query(
    collection(db, "products"),
    where("ownerId", "==", user.uid)
  );

  const productSnap = await getDocs(productQuery);

  productSnap.forEach(docSnap => {
    const product = docSnap.data();
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h4>${product.title}</h4>
      <p>$${product.price}</p>
    `;
    myProducts.appendChild(div);
  });

  // CHATS DEL USUARIO
  const chatQuery = query(
    collection(db, "chats"),
    where("participants", "array-contains", user.uid)
  );

  onSnapshot(chatQuery, snapshot => {

    myChats.innerHTML = "";

    snapshot.forEach(docSnap => {
      const chat = docSnap.data();
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <p>Producto: ${chat.productId}</p>
        <p>${chat.lastMessage || "Sin mensajes"}</p>
      `;
      div.onclick = () => {
        window.location.href = `chat.html?id=${docSnap.id}`;
      };
      myChats.appendChild(div);
    });
  });

});
</script>

</body>
</html>
