<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Perfil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <h1 id="name"></h1>
  <p id="email"></p>
  <button id="logout">Cerrar sesión</button>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { observeUser, logout, protectPage } from "./auth.js";

protectPage();

observeUser(user => {
  if (!user) return;
  name.textContent = user.displayName;
  email.textContent = user.email;
});

logout.onclick = () => logout();
</script>

</body>
</html>
