<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil | IMPULSO</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<nav class="navbar">
  <div class="logo">IMPULSO</div>
  <div class="nav-links">
    <a href="products.html">Explorar</a>
    <a href="publicar.html">Publicar</a>
    <a href="#" id="loginBtn">Login</a>
  </div>
</nav>

<section class="profile-section">
  <h2 id="userName"></h2>
  <p>Mis publicaciones</p>
  <div id="userProducts" class="products-grid"></div>
</section>

<script type="module">
import { observeAuth, logout } from "./auth.js";
import { getFirestore, collection, query, where, getDocs }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const db = getFirestore();
const userName = document.getElementById("userName");
const container = document.getElementById("userProducts");
const loginBtn = document.getElementById("loginBtn");

observeAuth(async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  userName.textContent = user.displayName;

  loginBtn.textContent = "Cerrar sesión";
  loginBtn.onclick = () => logout();

  /* 🔎 CONSULTAR SOLO PRODUCTOS DEL USUARIO */
  const q = query(
    collection(db, "products"),
    where("sellerId", "==", user.uid)
  );

  const snapshot = await getDocs(q);

  container.innerHTML = "";

  if (snapshot.empty) {
    container.innerHTML = "<p>No tienes publicaciones aún.</p>";
    return;
  }

  snapshot.forEach(doc => {
    const data = doc.data();

    const card = document.createElement("div");
    card.className = "product-card";

    card.innerHTML = `
      <h3>${data.title}</h3>
      <p>$${data.price}</p>
      <button onclick="window.location.href='product.html?id=${doc.id}'" class="btn-secondary">
        Ver
      </button>
    `;

    container.appendChild(card);
  });

});
</script>

</body>
</html>
