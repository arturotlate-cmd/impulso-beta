<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Producto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="product"></div>

<script type="module">
import { db } from "./firebase.js";
import { observeAuth } from "./auth.js";
import {
  doc,
  getDoc,
  collection,
  addDoc,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const productSnap = await getDoc(doc(db, "products", id));
const product = productSnap.data();

const container = document.getElementById("product");

container.innerHTML = `
  <h2>${product.title}</h2>
  <p>${product.description}</p>
  <strong>$${product.price}</strong>
  <button id="contact">Contactar</button>
`;

observeAuth(user => {
  if (!user) return;

  document.getElementById("contact").onclick = async () => {

    if (user.uid === product.ownerId) {
      alert("No puedes contactarte a ti mismo.");
      return;
    }

    const q = query(
      collection(db, "chats"),
      where("productId", "==", id),
      where("participants", "array-contains", user.uid)
    );

    const snapshot = await getDocs(q);

    if (!snapshot.empty) {
      window.location.href = `chat.html?id=${snapshot.docs[0].id}`;
      return;
    }

    const chatRef = await addDoc(collection(db, "chats"), {
      productId: id,
      buyerId: user.uid,
      sellerId: product.ownerId,
      participants: [user.uid, product.ownerId],
      createdAt: new Date(),
      lastMessage: ""
    });

    window.location.href = `chat.html?id=${chatRef.id}`;
  };
});
</script>

</body>
</html>
